version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: brightloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: brightloop
      POSTGRES_USER: brightloop
      POSTGRES_PASSWORD: brightloop_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightloop -d brightloop"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: brightloop-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  postgres_data:
